name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --release --workspace --locked
      - run: python3 tests/integration.py
        env:
          NAMESERVER_BIN_DIR: target/release
      - name: Package binaries and configuration
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          package="nameserver-${GITHUB_REF_NAME}-${target}"
          mkdir -p "dist/${package}/bin"
          cp target/release/nameserver-resolver target/release/nameserver-authority target/release/nameserver-control target/release/nameserver "dist/${package}/bin/"
          cp -R examples resources docs atlas tools "dist/${package}/"
          cp README.md LICENSE atlas.hcl "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
