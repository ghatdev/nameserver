[package]
name = "nameserver-common"
description = "Shared management protocol, filters, profiles, and telemetry for Nameserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
xorf = { workspace = true }
anyhow = { workspace = true }
idna = "1"
sqlx = { version = "0.8", features = ["postgres", "derive"], default-features = false, optional = true }

async-nats = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
nats = ["dep:async-nats", "dep:tracing"]
postgres = ["sqlx"]

[dev-dependencies]
rmp-serde = { workspace = true }
bincode = { workspace = true }
