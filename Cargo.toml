[workspace]
members = ["crates/nameserver-core", "crates/nameserver-resolver", "crates/nameserver-authority"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ghatdev/nameserver"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hickory-server = { version = "0.26.3", default-features = false, features = ["resolver", "recursor", "dnssec-ring", "https-ring", "tls-ring", "toml", "webpki-roots"] }
ipnet = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nameserver-core = { path = "crates/nameserver-core" }

[profile.release]
lto = "thin"
strip = "debuginfo"
