[workspace]
members = ["crates/nameserver-core", "crates/nameserver-resolver", "crates/nameserver-authority", "crates/nameserver-common", "crates/nameserver-control", "crates/nameserver-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ghatdev/nameserver"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hickory-server = { version = "0.26.3", default-features = false, features = ["resolver", "recursor", "dnssec-ring", "https-ring", "tls-ring", "toml", "webpki-roots"] }
ipnet = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nameserver-core = { path = "crates/nameserver-core" }

serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
# Management utilities retain their wire compatibility while the server uses Hickory 0.26.
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }
clickhouse = { version = "0.14", features = ["inserter", "rustls-tls-ring", "rustls-tls-webpki-roots", "uuid", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "time", "uuid", "json", "ipnetwork"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
fst = "0.4"
xorf = { version = "0.12", features = ["serde"] }
bincode = "1"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
instant-acme = "0.8"
async-nats = "0.38"
futures = "0.3"
hex = "0.4"
rust_jarm = "0.3"
webpki-roots = "1"
nameserver-common = { path = "crates/nameserver-common" }

[profile.release]
lto = "thin"
strip = "debuginfo"
