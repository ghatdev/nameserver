[project]
name = "nameserver-ml"
version = "0.1.0"
description = "ML scoring engine for Nameserver DNS threat detection"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "shap>=0.43",
    "onnxmltools>=1.12",
    "onnxconverter-common>=1.14",
    "onnxruntime>=1.17",
    "tldextract>=5.0",
    "dnspython>=2.6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "dnstwist>=20250130",
    "torch>=2.0",
    "onnxscript>=0.6.2",
    "pyarrow>=23.0.1",
    "psycopg2-binary>=2.9.11",
    "transformers>=5.3.0",
    "datasets>=4.8.3",
    "accelerate>=1.13.0",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.12.0",
    "msgpack>=1.1.2",
    "clickhouse-connect>=0.15.0",
]
