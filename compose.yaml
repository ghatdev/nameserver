name: nameserver
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nameserver
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nameserver"]
      interval: 2s
      timeout: 3s
      retries: 30
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:24222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.24.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:28123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  nats-data:
  clickhouse-data:
